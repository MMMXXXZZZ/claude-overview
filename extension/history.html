<!doctype html>
<meta charset="utf-8" />
<title>Claude Overview — history</title>
<style>
  :root { color-scheme: light dark; --line: #8883; --dim: #7a7a7a; --accent: #d97757; }
  body {
    font: 14px/1.6 system-ui, sans-serif;
    max-width: 900px; margin: 32px auto; padding: 0 20px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  input[type="search"] { flex: 1 1 260px; }
  input, select {
    font: inherit; padding: 7px 10px;
    border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: inherit;
  }
  button {
    font: inherit; padding: 7px 14px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px;
    background: transparent; color: inherit;
  }
  button.danger { border-color: #c5221f55; color: #c5221f; }
  .count { color: var(--dim); font-size: 13px; margin: 6px 0 18px; }
  .row {
    border-top: 1px solid var(--line);
    padding: 14px 0;
  }
  .q { font-weight: 600; margin-bottom: 4px; }
  .meta {
    font-size: 12px; color: var(--dim);
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px;
  }
  .tag {
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px;
  }
  .a { white-space: pre-wrap; }
  .err { color: #c5221f; white-space: pre-wrap; }
  mark { background: #d9775744; color: inherit; border-radius: 3px; }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }
</style>

<h1>Claude Overview history</h1>

<div class="bar">
  <input id="q" type="search" placeholder="Search queries and answers…" autofocus />
  <select id="model"><option value="">All models</option></select>
  <select id="effort"><option value="">All efforts</option></select>
  <select id="search">
    <option value="">Search: any</option>
    <option value="1">Web search on</option>
    <option value="0">Web search off</option>
  </select>
  <button id="export">Export JSON</button>
  <button id="clear" class="danger">Clear</button>
</div>
<div class="count" id="count"></div>
<div id="list"></div>

<script src="history.js"></script>
